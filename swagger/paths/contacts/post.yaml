tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
        properties:
          name:
            description: "SContacts's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contacts's phoneNumber"
            type: number
            example: 1234567891
          email:
            description: "Contacts's email"
            type: string
            example: test
          isFavourite:
            description: 'Is it favorite contact?'
            type: boolean
            example: false
          contactType:
            description: 'ContactType'
            type: string
            example: ('work', 'home', 'personal')
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
